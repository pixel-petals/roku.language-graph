name: Submodules

# Tells pixel-petals/.devops this repository's main moved, through the notify
# workflow in public pixel-petals/.github, which runs with this repository's
# own `submodule-sync` environment.
# See pixel-petals/.devops/.github/readme.md#following-submodule-branches.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  notify:
    uses: pixel-petals/.github/.github/workflows/submodule-sync.yml@main
    # the called job reads this repository's `submodule-sync` environment only
    # when secrets are passed on
    secrets: inherit
